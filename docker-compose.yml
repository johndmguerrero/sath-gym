services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sath_gym
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sath_gym"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:80"
    environment:
      RAILS_ENV: production
      DB_HOST: db
      SATH_GYM_DATABASE_PASSWORD: password
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_SERVE_STATIC_FILES: "true"
      DISABLE_SSL: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
